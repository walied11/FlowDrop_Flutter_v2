name: flowdrop
description: FlowDrop - تطبيق تحميل الفيديوهات (Flutter) جاهز لـ Klencod IDE
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  path_provider: ^2.1.4
  shared_preferences: ^2.2.2
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.1
  video_player: ^2.9.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/anim/
